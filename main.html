<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorseApp</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">Speak one at a time, pause between letters.</div>
    <div class="wrapper">
        <input type="text" id="name" class="break" required placeholder="Name">
        <button class="break">Enter</button>
    </div>
    <div class="controls">Left arrow are dits, right are dahs.</div>
    <div class="second-wrapper">
        <div class="counter">[speaker count] people are online</div>
        <div class="speaker">[speaker] is speaking</div>
    </div>
</body>
</html>
